[project]
name = "homelab-assistant"
version = "0.19.0"
description = "Assistant personnel homelab : orchestrateur, voix, domotique."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pyyaml>=6.0",
    "pydantic>=2.7",
    "websockets>=12",
    "faster-whisper>=1.1",
    "piper-tts>=1.3",
    "kokoro-onnx>=0.4",
    "av>=12",
    "numpy>=1.26",
    "httpx>=0.27",
    "segno>=1.6",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "httpx>=0.27"]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["assistant*"]

[tool.setuptools.package-data]
assistant = ["static/*", "static/icones/*", "defaults.yaml", "donnees/*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
