# Valeurs par défaut de l'assistant.
# C'est le SEUL endroit où le nom par défaut est écrit : le code le lit d'ici.
# Ne modifie pas ce fichier pour ta config : copie config/config.example.yaml
# vers config/config.yaml (ou /config/config.yaml dans le conteneur).

identite:
  nom: "Magnus"
  # Vide = le wake word suit le nom (en minuscules).
  wake_word: ""
  langue: "fr"

serveur:
  hote: "0.0.0.0"
  port: 8080

# Consigne système envoyée aux modèles. {nom} est remplacé par le nom ci-dessus.
consigne: >-
  Tu es {nom}, l'assistant personnel d'un foyer. Tu réponds en français,
  de façon claire et brève, sauf si on te demande des détails.

# Fournisseurs de modèles. Chaque entrée est interchangeable.
#   type     : "openai" = toute API compatible OpenAI (Ollama, LM Studio, vLLM, clé API…)
#              "claude_code" = Claude via le binaire officiel et ton abonnement
#   url      : URL de base de l'API (se termine en général par /v1)
#   modele   : nom du modèle côté fournisseur
#   cle_env  : NOM d'une variable d'environnement qui contient la clé (jamais la clé ici)
#   timeout  : secondes
#   options  : paramètres passés tels quels (temperature, max_tokens…)
fournisseurs:
  # Claude via l'abonnement : binaire officiel Claude Code en headless, sans aucun outil.
  #   commande : nom ou chemin du binaire (connecté une fois avec « claude auth login »)
  #   modele   : alias (sonnet, opus, haiku) ou nom complet
  #   effort   : vide = réglage par défaut du binaire
  claude:
    type: claude_code
    commande: "claude"
    modele: "sonnet"
    timeout: 120
  ollama-local:
    type: openai
    url: "http://127.0.0.1:11434/v1"
    modele: "qwen2.5:3b"
    timeout: 60
    options:
      temperature: 0.4

# Quel fournisseur joue quel rôle. Le routeur (plus tard) choisira le rôle.
#   rapide        : commandes simples, réponses courtes
#   raisonnement  : conversation, diagnostic (Claude)
#   secours       : utilisé si le fournisseur du rôle demandé ne répond pas
roles:
  rapide: ollama-local
  raisonnement: claude
  secours: ollama-local

# Routeur : envoie chaque demande au rôle « rapide » (simple) ou « raisonnement » (complexe).
# 1. règles ci-dessous (expressions régulières, sans tenir compte des majuscules)
# 2. sinon le modèle du rôle « classeur » répond SIMPLE ou COMPLEXE
# 3. sinon « defaut »
routeur:
  role_simple: rapide
  role_complexe: raisonnement
  classeur: rapide
  delai_classeur_ms: 4000    # laisse le temps au modèle de se charger s'il dormait
  defaut: complexe
  longueur_complexe: 220      # un message plus long que ça part en complexe
  regles_simples:
    # commandes de la maison, en début de phrase
    - '^\s*(peux-tu |tu peux |merci de )?(allume|[ée]teins?|ouvre|ferme|monte|baisse|augmente|diminue|r[ée]gle|mets|coupe|active|d[ée]sactive|lance|arr[êe]te|d[ée]marre|stoppe)\b'
    - '\b(minuteur|chrono|compte [àa] rebours|r[ée]veil)\b'
    - '^\s*quelle heure\b'
    - '^\s*(quelle|combien de) temp[ée]rature\b'
    - '^\s*il fait (combien|quelle temp[ée]rature)\b'
    # politesse seule
    - '^\s*(bonjour|bonsoir|salut|coucou|merci|ok|d.accord|super|parfait|bonne nuit)\b[\s!.,]*\w{0,12}[\s!.]*$'
  regles_complexes:
    - '\b(pourquoi|explique|expliquer|analyse|compare|comparer|r[ée]sume|r[ée]sumer|r[ée]dige|[ée]cris|diagnostic|diagnostique|conseille|recommande|planifie|organise)\b'
    - '\b(aide-moi [àa]|comment (faire|fonctionne|marche|r[ée]parer)|quelle est la diff[ée]rence|quels sont les avantages|que penses-tu)\b'
