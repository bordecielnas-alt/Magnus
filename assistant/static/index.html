<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Assistant</title>
<style>
  :root { --bg:#f6f7f8; --fg:#14181c; --muted:#5b6670; --accent:#0f8b8d; --bulle:#e7ecef; --bord:#d3dade; }
  @media (prefers-color-scheme: dark) { :root { --bg:#0d1114; --fg:#e8ecef; --muted:#8a96a0; --accent:#3cc6c8; --bulle:#1a2126; --bord:#2a333a; } }
  * { box-sizing:border-box; }
  html,body { height:100%; margin:0; }
  body { background:var(--bg); color:var(--fg); font-family:system-ui,sans-serif; }
  main { max-width:720px; height:100%; margin:0 auto; padding:16px; display:flex; flex-direction:column; }
  header { position:relative; text-align:center; padding:4px 0 8px; }
  /* Orbe : canvas animé (static/orbe.js), posé sur un fond sombre pour briller aussi en thème clair */
  .orbe-cadre { width:160px; height:160px; margin:0 auto 4px; border-radius:50%;
                background:radial-gradient(circle, #0a1018 0 44%, rgba(10,16,24,.5) 54%, transparent 66%); }
  .orbe { width:100%; height:100%; display:block; }
  #reglagesOrbe { position:absolute; top:4px; right:0; padding:6px 10px; background:transparent; color:var(--muted);
                  border:1px solid var(--bord); font-size:1.1rem; line-height:1; }
  #reglagesOrbe:hover { color:var(--fg); }
  dialog { border:1px solid var(--bord); border-radius:14px; background:var(--bg); color:var(--fg); padding:18px 20px; width:min(92vw, 380px); }
  #micro { padding:0 14px; background:var(--bulle); color:var(--fg); border:1px solid var(--bord); font-size:1.1rem; }
  #micro.actif { background:#c0392b; color:#fff; border-color:#c0392b; }
  .ecoute { align-self:flex-end; max-width:85%; padding:10px 14px; border-radius:14px; border:2px dashed #c0392b;
            color:var(--fg); line-height:1.45; }
  .ecoute .tete { display:flex; align-items:center; gap:8px; font-size:.8rem; color:#c0392b; font-weight:600; }
  .ecoute .point { width:10px; height:10px; border-radius:50%; background:#c0392b; animation:clignote 1s ease-in-out infinite; }
  .ecoute .niveau { flex:1; min-width:60px; height:6px; border-radius:3px; background:var(--bord); overflow:hidden; }
  .ecoute .niveau span { display:block; height:100%; width:0; background:#c0392b; transition:width .08s; }
  .ecoute .mots { margin-top:4px; min-height:1.4em; }
  .ecoute .mots:empty::before { content:"Parle, je t'écoute…"; color:var(--muted); font-style:italic; }
  @keyframes clignote { 50% { opacity:.35; } }
  dialog .case { display:flex; gap:8px; align-items:center; margin-bottom:14px; font-size:.9rem; color:var(--muted); }
  dialog::backdrop { background:rgba(0,0,0,.45); }
  dialog form { display:block; padding:0; border:0; }
  dialog input[type=range] { width:100%; flex:none; }
  dialog h2 { margin:0 0 12px; font-size:1.1rem; }
  dialog .ligne { display:grid; gap:6px; margin-bottom:14px; font-size:.9rem; color:var(--muted); }
  dialog .ecoles { display:flex; flex-wrap:wrap; gap:6px; }
  dialog .ecoles button { padding:6px 12px; background:var(--bulle); color:var(--fg); border:1px solid var(--bord); font-size:.9rem; }
  dialog .ecoles button[aria-pressed="true"] { border-color:var(--accent); outline:1px solid var(--accent); }
  dialog input[type=range] { padding:0; accent-color:var(--accent); }
  dialog .actions { display:flex; justify-content:space-between; gap:8px; }
  dialog .actions button { padding:8px 14px; }
  dialog .actions .discret { background:transparent; color:var(--muted); border:1px solid var(--bord); }
  h1 { margin:0 0 4px; font-size:2rem; letter-spacing:.02em; }
  .meta { margin:0; color:var(--muted); font-size:.85rem; }
  code { color:var(--fg); }
  #fil { flex:1; overflow-y:auto; padding:8px 0; display:flex; flex-direction:column; gap:8px; }
  .msg { max-width:85%; padding:10px 14px; border-radius:14px; line-height:1.45; white-space:pre-wrap; overflow-wrap:anywhere; }
  .moi { align-self:flex-end; background:var(--accent); color:#fff; }
  .lui { align-self:flex-start; background:var(--bulle); }
  .lui small { display:block; margin-top:6px; color:var(--muted); font-size:.75rem; }
  .erreur { align-self:center; color:#c0392b; font-size:.9rem; }
  form { display:flex; gap:8px; padding-top:8px; border-top:1px solid var(--bord); }
  select { padding:0 8px; border-radius:10px; border:1px solid var(--bord); background:var(--bg); color:var(--fg); font-size:.95rem; }
  input { flex:1; min-width:0; padding:12px; border-radius:10px; border:1px solid var(--bord);
          background:var(--bg); color:var(--fg); font-size:1rem; }
  button { padding:0 18px; border:0; border-radius:10px; background:var(--accent); color:#fff; font-size:1rem; cursor:pointer; }
  button:disabled { opacity:.5; cursor:default; }
</style>
</head>
<body>
<main>
  <header>
    <div class="orbe-cadre"><canvas class="orbe" id="orbe" aria-hidden="true"></canvas></div>
    <button type="button" id="reglagesOrbe" title="Apparence de l'orbe" aria-label="Apparence de l'orbe">⚙</button>
    <h1 id="nom">…</h1>
    <p class="meta">Wake word : <code id="wake">…</code> · <span id="version"></span> · <span id="modeles">modèles…</span></p>
  </header>
  <div id="fil" aria-live="polite"></div>
  <form id="form">
    <select id="role" aria-label="Rôle du modèle" title="Auto : le routeur choisit. Rapide ou Raisonnement : forcé à la main">
      <option value="auto" selected>Auto</option>
      <option value="rapide">Rapide</option>
      <option value="raisonnement">Raisonnement</option>
    </select>
    <input id="saisie" autocomplete="off" placeholder="Écris un message…" required>
    <button type="button" id="micro" title="Parler : je m'arrête tout seul quand tu te tais (re-clic pour arrêter)" aria-label="Parler">🎤</button>
    <button id="envoyer">Envoyer</button>
  </form>
</main>
<dialog id="dlgOrbe">
  <form method="dialog">
    <h2>Apparence de l'orbe</h2>
    <div class="ligne">École de magie<div class="ecoles" id="ecoles"></div></div>
    <label class="ligne" for="rgParticules">Particules<input type="range" id="rgParticules" min="0" max="400" step="10"></label>
    <label class="ligne" for="rgBrume">Brume<input type="range" id="rgBrume" min="0" max="100"></label>
    <label class="case"><input type="checkbox" id="lireTout"> Lire aussi à voix haute les réponses aux messages écrits</label>
    <div class="actions">
      <button type="button" class="discret" id="orbeDefaut">Valeurs par défaut</button>
      <button value="ok">Fermer</button>
    </div>
  </form>
</dialog>
<script src="/static/orbe.js"></script>
<script>
const $ = id => document.getElementById(id);
const historique = [];
const conversation = (crypto.randomUUID ? crypto.randomUUID() : String(Math.random())).slice(0, 36);

// ----- Orbe : apparence réglable, gardée dans ce navigateur -----
const ORBE_DEFAUT = {ecole: 'givre', particules: 80, brume: 75};
let reglagesOrbe = {...ORBE_DEFAUT};
try { Object.assign(reglagesOrbe, JSON.parse(localStorage.getItem('orbe.reglages') || '{}')); } catch (e) {}
const orbe = creerOrbe($('orbe'), {ecole: reglagesOrbe.ecole, particules: reglagesOrbe.particules, brume: reglagesOrbe.brume / 100});
let occupe = false, minuteurEcoute = null, minuteurErreur = null;

function appliquerOrbe() {
  orbe.reglages({ecole: reglagesOrbe.ecole, particules: reglagesOrbe.particules, brume: reglagesOrbe.brume / 100});
  $('rgParticules').value = reglagesOrbe.particules;
  $('rgBrume').value = reglagesOrbe.brume;
  for (const b of $('ecoles').children) b.setAttribute('aria-pressed', String(b.dataset.ecole === reglagesOrbe.ecole));
  try { localStorage.setItem('orbe.reglages', JSON.stringify(reglagesOrbe)); } catch (e) {}
}
for (const [cle, nom] of Object.entries(creerOrbe.ECOLES)) {
  const b = document.createElement('button');
  b.type = 'button'; b.dataset.ecole = cle; b.textContent = nom;
  b.onclick = () => { reglagesOrbe.ecole = cle; appliquerOrbe(); };
  $('ecoles').appendChild(b);
}
$('rgParticules').oninput = e => { reglagesOrbe.particules = +e.target.value; appliquerOrbe(); };
$('rgBrume').oninput = e => { reglagesOrbe.brume = +e.target.value; appliquerOrbe(); };
$('orbeDefaut').onclick = () => { reglagesOrbe = {...ORBE_DEFAUT}; appliquerOrbe(); };
$('reglagesOrbe').onclick = () => $('dlgOrbe').showModal();
appliquerOrbe();

// L'orbe « écoute » pendant qu'on lui écrit, puis revient au repos.
$('saisie').addEventListener('input', () => {
  if (occupe) return;
  orbe.etat($('saisie').value ? 'ecoute' : 'repos');
  clearTimeout(minuteurEcoute);
  minuteurEcoute = setTimeout(() => { if (!occupe) orbe.etat('repos'); }, 2500);
});
$('saisie').addEventListener('blur', () => { if (!occupe) orbe.etat('repos'); });

fetch('/api/info').then(r => r.json()).then(i => {
  document.title = i.nom;
  $('nom').textContent = i.nom;
  $('wake').textContent = i.wake_word;
  $('version').textContent = 'v' + i.version;
  $('saisie').placeholder = 'Écris à ' + i.nom + '…';
}).catch(() => { $('nom').textContent = 'Orchestrateur injoignable'; });

fetch('/api/fournisseurs').then(r => r.json()).then(e => {
  $('modeles').textContent = e.fournisseurs
    .map(f => (f.disponible ? '● ' : '○ ') + f.modele + ' (' + f.roles.join(', ') + ')').join(' · ');
}).catch(() => { $('modeles').textContent = 'modèles inconnus'; });

function bulle(classe, texte) {
  const d = document.createElement('div');
  d.className = 'msg ' + classe;
  d.textContent = texte;
  $('fil').appendChild(d);
  $('fil').scrollTop = $('fil').scrollHeight;
  return d;
}

$('form').addEventListener('submit', ev => {
  ev.preventDefault();
  const message = $('saisie').value.trim();
  if (!message) return;
  $('saisie').value = '';
  envoyerMessage(message, false);
});

async function envoyerMessage(message, vocal) {
  $('envoyer').disabled = true;
  occupe = true; clearTimeout(minuteurEcoute); clearTimeout(minuteurErreur);
  orbe.etat('reflexion');
  bulle('moi', message);
  const rep = bulle('lui', '');
  let texte = '', route = null;
  try {
    const r = await fetch('/api/chat', {
      method: 'POST', headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({message, historique, flux: true, role: $('role').value, conversation}),
    });
    if (!r.ok) throw new Error((await r.json()).detail || r.statusText);
    const lecteur = r.body.getReader();
    const dec = new TextDecoder();
    let tampon = '';
    for (;;) {
      const {value, done} = await lecteur.read();
      if (done) break;
      tampon += dec.decode(value, {stream: true});
      let i;
      while ((i = tampon.indexOf('\n')) >= 0) {
        const ligne = tampon.slice(0, i); tampon = tampon.slice(i + 1);
        if (!ligne) continue;
        const o = JSON.parse(ligne);
        if (o.route) route = o.route;
        if (o.delta) { if (orbe.etatCourant !== 'parole') orbe.etat('parole'); orbe.impulsion(o.delta.length); texte += o.delta; rep.firstChild ? rep.firstChild.textContent = texte : rep.textContent = texte; }
        if (o.erreur) throw new Error(o.erreur);
        if (o.fin) {
          const s = document.createElement('small');
          let r = '';
          if (route && route.categorie) r = route.categorie + ' (' + route.raison.replace(/^règle : .*/, 'règle') + ', ' + Math.round(route.duree_ms) + ' ms) → ';
          else if (route) r = 'forcé → ';
          s.textContent = r + ({'home-assistant': 'Home Assistant (Assist)', 'maison': 'Maison'}[o.fournisseur] || o.modele) + (o.secours ? ' (secours)' : '') + ' · 1er mot ' + o.premier_ms + ' ms · ' + o.duree_ms + ' ms';
          if (route && route.raison) s.title = route.raison;
          rep.appendChild(s);
        }
      }
      $('fil').scrollTop = $('fil').scrollHeight;
    }
    historique.push({role: 'user', content: message}, {role: 'assistant', content: texte});
    if (texte && (vocal || $('lireTout').checked)) await direAVoixHaute(texte);
  } catch (e) {
    if (!texte) rep.remove();
    bulle('erreur', 'Erreur : ' + e.message);
    orbe.etat('erreur');
    minuteurErreur = setTimeout(() => { if (!occupe) orbe.etat('repos'); }, 4000);
  } finally {
    $('envoyer').disabled = false;
    occupe = false;
    if (orbe.etatCourant !== 'erreur') orbe.etat('repos');
    $('saisie').focus();
  }
}

// ----- Voix : un seul bouton. Clic -> j'écoute ; je m'arrête tout seul après un silence -----
let enregistreur = null, morceaux = [], fluxMicro = null, lecture = null, bulleEcoute = null;
let partielEnCours = false, minuteurPartiel = null;
try { $('lireTout').checked = localStorage.getItem('voix.lireTout') === '1'; } catch (e) {}
$('lireTout').onchange = () => { try { localStorage.setItem('voix.lireTout', $('lireTout').checked ? '1' : '0'); } catch (e) {} };

$('micro').onclick = async () => {
  if (lecture) { lecture.pause(); lecture = null; }
  if (enregistreur && enregistreur.state === 'recording') { enregistreur.stop(); return; }
  if (occupe) return;
  try {
    fluxMicro = await navigator.mediaDevices.getUserMedia({audio: {echoCancellation: true, noiseSuppression: true}});
  } catch (e) {
    bulle('erreur', 'Micro inaccessible : autorise le micro pour cette page.');
    return;
  }
  morceaux = [];
  enregistreur = new MediaRecorder(fluxMicro);
  enregistreur.ondataavailable = ev => { if (ev.data.size) morceaux.push(ev.data); };
  enregistreur.onstop = transcrireEtEnvoyer;
  enregistreur.start(500);   // un morceau toutes les 0,5 s : sert aux mots en direct
  $('micro').classList.add('actif'); $('micro').textContent = '⏹';
  bulleEcoute = document.createElement('div');
  bulleEcoute.className = 'ecoute';
  bulleEcoute.innerHTML = '<div class="tete"><span class="point"></span><span class="temps">0 s</span><span class="niveau"><span></span></span></div><div class="mots"></div>';
  $('fil').appendChild(bulleEcoute); $('fil').scrollTop = $('fil').scrollHeight;
  orbe.etat('ecoute');
  suivreVolume(fluxMicro);
  minuteurPartiel = setInterval(transcriptionPartielle, 1200);
};

function arreter() { if (enregistreur && enregistreur.state === 'recording') enregistreur.stop(); }

function suivreVolume(flux) {
  // niveau du micro, minuteur, et arrêt automatique : 1,2 s de silence après avoir parlé (ou 6 s sans rien)
  try {
    const ctx = new AudioContext(), src = ctx.createMediaStreamSource(flux), an = ctx.createAnalyser();
    an.fftSize = 512; src.connect(an);
    const buf = new Uint8Array(an.fftSize), debut = performance.now();
    let aParle = false, dernierSon = debut;
    const tic = () => {
      if (!enregistreur || enregistreur.state !== 'recording') { ctx.close(); return; }
      an.getByteTimeDomainData(buf);
      let m = 0; for (const v of buf) m = Math.max(m, Math.abs(v - 128));
      const t = performance.now();
      if (m > 14) { aParle = true; dernierSon = t; orbe.impulsion(Math.round(m / 6)); }
      if (bulleEcoute) {
        bulleEcoute.querySelector('.niveau span').style.width = Math.min(100, m * 1.6) + '%';
        bulleEcoute.querySelector('.temps').textContent = Math.floor((t - debut) / 1000) + ' s';
      }
      if ((aParle && t - dernierSon > 1200) || (!aParle && t - debut > 6000) || t - debut > 30000) { arreter(); return; }
      requestAnimationFrame(tic);
    };
    tic();
  } catch (e) {}
}

async function transcriptionPartielle() {
  // tes mots s'affichent pendant que tu parles (transcription de tout ce qui a été dit jusqu'ici)
  if (partielEnCours || !morceaux.length || !enregistreur || enregistreur.state !== 'recording') return;
  partielEnCours = true;
  try {
    const blob = new Blob(morceaux, {type: enregistreur.mimeType || 'audio/webm'});
    const r = await fetch('/api/voix/transcrire?partiel=1', {method: 'POST', headers: {'Content-Type': blob.type}, body: blob});
    if (r.ok && bulleEcoute && enregistreur && enregistreur.state === 'recording') {
      const o = await r.json();
      if (o.texte) bulleEcoute.querySelector('.mots').textContent = o.texte;
    }
  } catch (e) {} finally { partielEnCours = false; }
}

async function transcrireEtEnvoyer() {
  clearInterval(minuteurPartiel);
  $('micro').classList.remove('actif'); $('micro').textContent = '🎤';
  if (fluxMicro) fluxMicro.getTracks().forEach(t => t.stop());
  const blob = new Blob(morceaux, {type: enregistreur.mimeType || 'audio/webm'});
  enregistreur = null;
  const finirBulle = () => { if (bulleEcoute) { bulleEcoute.remove(); bulleEcoute = null; } };
  if (blob.size < 2000) { finirBulle(); orbe.etat('repos'); return; }
  if (bulleEcoute) bulleEcoute.querySelector('.tete').innerHTML = '<span>Je transcris…</span>';
  orbe.etat('reflexion');
  try {
    const r = await fetch('/api/voix/transcrire', {method: 'POST', headers: {'Content-Type': blob.type}, body: blob});
    const o = await r.json();
    finirBulle();
    if (!r.ok) throw new Error(o.detail || r.statusText);
    if (!o.texte) { orbe.etat('repos'); bulle('erreur', 'Je n\'ai rien entendu.'); return; }
    await envoyerMessage(o.texte, true);
    const derniere = [...document.querySelectorAll('.msg.moi')].pop();
    if (derniere) derniere.title = 'Transcrit en ' + o.duree_ms + ' ms (' + o.duree_audio_s + ' s d\'audio)';
  } catch (e) {
    finirBulle();
    bulle('erreur', 'Voix : ' + e.message);
    orbe.etat('erreur');
    setTimeout(() => { if (!occupe) orbe.etat('repos'); }, 4000);
  }
}

async function direAVoixHaute(texte) {
  try {
    const r = await fetch('/api/voix/parler', {method: 'POST', headers: {'Content-Type': 'application/json'},
                                               body: JSON.stringify({texte: texte.slice(0, 4000)})});
    if (!r.ok) return;
    const url = URL.createObjectURL(await r.blob());
    lecture = new Audio(url);
    orbe.etat('parole');
    const pulse = setInterval(() => orbe.impulsion(4), 180);
    await new Promise(res => { lecture.onended = lecture.onerror = lecture.onpause = res; lecture.play().catch(res); });
    clearInterval(pulse);
    URL.revokeObjectURL(url);
    lecture = null;
  } catch (e) {}
}
</script>
</body>
</html>
