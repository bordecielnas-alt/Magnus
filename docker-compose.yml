# Alternative au template Unraid (Compose Manager) — voir docs/unraid.md
services:
  orchestrateur:
    image: ghcr.io/bordecielnas-alt/magnus:latest
    restart: unless-stopped
    runtime: nvidia
    ports:
      - "${ASSISTANT_PORT_HOTE:-8080}:8080"
    environment:
      - TZ=Europe/Paris
      - NVIDIA_VISIBLE_DEVICES=${GPU_UUID:-all}
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility
      - ASSISTANT_TELECHARGER_MODELES=1
      - ASSISTANT_PROXIES_DE_CONFIANCE=${PROXY_NPM:-}
    volumes:
      - ${ASSISTANT_CONFIG_DIR:-/mnt/user/appdata/magnus}:/config
      - ${ASSISTANT_MODELES_DIR:-/mnt/user/appdata/magnus/modeles}:/modeles
