# Déploiement sur Unraid (Compose Manager ou ligne de commande).
# Le nom de l'assistant se règle dans /config/config.yaml ou via ASSISTANT_NOM.
services:
  orchestrateur:
    build: .
    image: homelab-assistant:latest
    restart: unless-stopped
    ports:
      - "${ASSISTANT_PORT_HOTE:-8080}:8080"
    environment:
      - TZ=Europe/Paris
      # - ASSISTANT_NOM=...
      # - ASSISTANT_WAKE_WORD=...
    volumes:
      # Sur Unraid : /mnt/user/appdata/<dossier>/config
      - ${ASSISTANT_CONFIG_DIR:-./config-local}:/config
